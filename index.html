<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Configurazione iOS Web App (Salva su Home) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fazioni" />
  <meta name="theme-color" content="#090d16" />

  <title>FAZIONI — Card Battle</title>

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Il nostro foglio di stile Liquid Glass -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#070a12] text-white select-none overflow-hidden font-sans antialiased">

  <!-- SFONDO DINAMICO ARENA (Cambia colore e particelle in base al Campo di Battaglia) -->
  <div id="arena-backdrop" class="fixed inset-0 transition-all duration-1000 z-0 arena-theme-default">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <!-- CONTENITORE PRINCIPALE IPHONE (Rispetta Dynamic Island e Home Indicator) -->
  <main id="app-container" class="relative z-10 w-screen h-[100dvh] flex flex-col justify-between safe-area-landscape overflow-hidden">

    <!-- ==========================================
         SCHERMATA 1: MENU PRINCIPALE & LOBBY (iOS Liquid Glass)
         ========================================== -->
    <section id="screen-menu" class="flex flex-col justify-between h-full py-4 px-4 overflow-y-auto no-scrollbar transition-all duration-500">
         
      <!-- Header Titolo -->
      <div class="text-center mt-6">
        <span class="px-3 py-1 text-[11px] font-semibold tracking-widest uppercase rounded-full liquid-pill text-cyan-300">
          Patch 1.4 Ufficiale
        </span>
        <h1 class="text-5xl font-black tracking-tight mt-3 bg-gradient-to-b from-white via-white to-white/50 bg-clip-text text-transparent drop-shadow-sm">
          FAZIONI
        </h1>
        <p class="text-xs text-white/60 mt-1 tracking-wide">Strategia Asimmetrica per 4 Giocatori</p>
      </div>

      <!-- Pannello Centrale Liquid Glass: Stanza & Opzioni -->
      <div class="liquid-glass p-5 flex flex-col gap-4 my-auto">
        
        <!-- Input Username -->
        <div>
            <label class="text-[11px] uppercase tracking-wider text-white/60 font-semibold block mb-1.5">
                Username
            </label>
            <input id="player-name-input" type="text" maxlength="12" placeholder="Es. Marco" 
                class="w-full liquid-input px-4 py-2.5 text-center font-bold text-sm text-white placeholder-white/30 focus:outline-none" />
        </div>

        <!-- Input Codice Stanza Multiplayer -->
        <div>
          <label class="text-[11px] uppercase tracking-wider text-white/60 font-semibold block mb-1.5">
            Stanza Multiplayer (4 Dispositivi)
          </label>
          <div class="flex gap-2">
            <input id="room-code-input" type="text" maxlength="5" placeholder="CODICE (es. NORD)" 
              class="w-full liquid-input px-4 py-3 text-center font-mono text-lg font-bold tracking-widest uppercase text-white placeholder-white/30 focus:outline-none" />
            <button onclick="UI.createOrJoinRoom()" class="liquid-btn-primary px-5 rounded-2xl font-bold text-sm flex items-center gap-1.5 shrink-0">
              <i data-lucide="wifi" class="w-4 h-4"></i> Entra
            </button>
          </div>
          <!-- NUOVO: Pannello Lobby Giocatori Connessi in Tempo Reale -->
            <div id="lobby-box" class="hidden flex-col gap-2 bg-black/35 p-3 rounded-2xl border border-cyan-400/30 mt-2">
            <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-cyan-300">
                <span>Stanza: <b id="lobby-room-label"></b></span>
                <span id="lobby-count-label">1/4 Giocatori</span>
            </div>
            <div id="lobby-players-list" class="flex flex-col gap-1 text-xs text-white/90"></div>
            <button onclick="UI.goToSetup()" class="liquid-btn-gold w-full py-2 mt-1 rounded-xl font-bold text-xs">
                Avvia Setup Partita
            </button>
            </div>
        </div>

        <div class="h-[1px] bg-white/10 my-1"></div>

        <!-- Toggle Moduli Opzionali (Campi di Battaglia & Risveglio Leader) -->
        <div class="flex flex-col gap-3">
          <span class="text-[11px] uppercase tracking-wider text-white/60 font-semibold">Moduli Espansione</span>
          
          <!-- Toggle 1: Campi di Battaglia -->
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl liquid-pill flex items-center justify-center text-amber-300">
                <i data-lucide="mountain-snow" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="text-sm font-semibold">Campi di Battaglia</div>
                <div class="text-[11px] text-white/50">Arene attive ed effetto [Spostamento]</div>
              </div>
            </div>
            <input id="toggle-arenas" type="checkbox" checked class="ios-switch" />
          </label>

          <!-- Toggle 2: Risveglio dei Leader -->
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-xl liquid-pill flex items-center justify-center text-rose-400">
                <i data-lucide="flame" class="w-4 h-4"></i>
              </div>
              <div>
                <div class="text-sm font-semibold">Risveglio dei Leader</div>
                <div class="text-[11px] text-white/50">Potere supremo a soglia critica + Cicatrice</div>
              </div>
            </div>
            <input id="toggle-awakening" type="checkbox" checked class="ios-switch" />
          </label>
        </div>

        <div class="h-[1px] bg-white/10 my-1"></div>

        <!-- Pulsante Avvio Rapido (Prototipo / Test 4 Giocatori) -->
        <button onclick="UI.goToSetup()" class="liquid-btn-gold w-full py-3.5 rounded-2xl font-bold text-base shadow-lg flex items-center justify-center gap-2">
          <i data-lucide="swords" class="w-5 h-5"></i>
          <span>Scegli Fazione e Inizia</span>
        </button>
      </div>

      <!-- Footer Info PWA -->
      <div class="text-center text-[11px] text-white/40 flex items-center justify-center gap-1.5">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>Ottimizzato per iOS • Salva su Home per Schermo Intero</span>
      </div>
    </section>

    <!-- ==========================================
         SCHERMATA 2: SELEZIONE FAZIONE, OBIETTIVO E LEADER
         ========================================== -->
    <section id="screen-setup" class="hidden flex-col justify-between h-full py-3 px-6 overflow-y-auto no-scrollbar">
      <div class="flex items-center justify-between">
        <button id="btn-setup-back" onclick="UI.backToMenu()" class="liquid-pill p-2 rounded-full">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <h2 id="setup-header-title" class="text-lg font-black tracking-wide uppercase text-center flex-1">
          Scegli la tua Fazione
        </h2>
        <div class="w-9"></div>
      </div>

      <div class="my-auto flex flex-col gap-3 max-w-xl mx-auto w-full">
        <!-- Griglia Fazioni (Sparisce appena ne clicchi una) -->
        <div id="faction-grid" class="grid grid-cols-2 gap-3"></div>

        <!-- Box Animazione Estrazione Obiettivo Segreto -->
        <div id="objective-preview-box" class="hidden liquid-glass p-4 border-amber-400/40 transition-all text-center">
          <div class="text-[10px] font-bold uppercase tracking-widest text-amber-300 flex items-center justify-center gap-1 mb-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 animate-spin"></i>
            <span id="objective-status-label">Estrazione Obiettivo Segreto...</span>
          </div>
          <div id="setup-objective-title" class="text-base font-black text-white"></div>
          <div id="setup-objective-desc" class="text-xs text-white/75 mt-1 leading-relaxed"></div>
        </div>

        <!-- Scelta del Leader con Artwork affiancato -->
        <div id="leader-selection-box" class="hidden flex-col gap-2">
          <p class="text-xs text-white/70 text-center">Scegli il tuo Leader:</p>
          <div id="leader-list" class="grid grid-cols-1 gap-2"></div>
        </div>
      </div>

      <button id="btn-enter-battle" onclick="UI.startMatch()" disabled 
        class="liquid-btn-primary max-w-xl mx-auto w-full py-3 rounded-2xl font-bold text-sm opacity-40 pointer-events-none transition-all">
        Entra nel Campo di Battaglia
      </button>
    </section>

    <!-- ==========================================
         SCHERMATA 3: IL TAVOLO DA GIOCO A 4 GIOCATORI
         ========================================== -->
    <section id="screen-table" class="hidden w-full h-full grid grid-cols-12 gap-2 p-2 relative">

        <!-- COLONNA SINISTRA (3 col): AVVERSARI IN VERTICALE (P2, P3, P4) -->
        <div id="opponents-col" class="col-span-3 flex flex-col justify-between gap-2 h-full z-20">
        <!-- Popolato da UI.renderTable() -->
        </div>

        <!-- COLONNA CENTRALE (6 col): ZONA ATK/DIF + PASSA + MANO -->
        <div class="col-span-6 flex flex-col justify-between items-center h-full z-20">

        <!-- In alto centralmente: Zona Carta ATK e Zona Carta DIF -->
        <div class="flex items-center justify-center gap-6 mt-1">
            <div class="flex flex-col items-center">
            <span id="atk-player-label" class="text-[10px] font-bold uppercase tracking-wider text-rose-300 mb-1 h-4"></span>
            <div id="slot-attacker"
                ondragover="event.preventDefault()"
                ondrop="Engine.onSlotDrop(event, 'atk')"
                onclick="UI.inspectSlot('atk')"
                class="battle-slot-landscape flex flex-col items-center justify-center text-white/30 text-xs cursor-pointer">
                <span>Zona ATK</span>
            </div>
            </div>

            <div class="flex flex-col items-center">
            <span id="dif-player-label" class="text-[10px] font-bold uppercase tracking-wider text-sky-300 mb-1 h-4"></span>
            <div id="slot-defender"
                ondragover="event.preventDefault()"
                ondrop="Engine.onSlotDrop(event, 'dif')"
                onclick="UI.inspectSlot('dif')"
                class="battle-slot-landscape flex flex-col items-center justify-center text-white/30 text-xs cursor-pointer">
                <span>Zona DIF</span>
            </div>
            </div>
        </div>

        <!-- Centralmente sopra la mano: Tasto "Passa" -->
        <div class="my-1">
            <button id="btn-pass-turn" onclick="UI.passTurn()" class="liquid-glass px-8 py-1.5 rounded-full text-xs font-black tracking-widest uppercase active:scale-95 transition">
            Passa
            </button>
        </div>

        <!-- In basso centralmente: La mia mano (Solo Immagine, PC, ATK, DIF) -->
        <div id="player-hand" class="flex items-center justify-center gap-2 overflow-x-auto no-scrollbar w-full px-2 py-1 min-h-[118px]">
            <!-- Carte compatte trascinabili -->
        </div>
        </div>

        <!-- COLONNA DESTRA (3 col): RISORSE/COPPA/ARENA IN ALTO + ARTWORK LEADER IN BASSO -->
        <div class="col-span-3 flex flex-col justify-between items-end h-full z-20">

        <!-- In alto a destra: Vita, Costo, Buff Attivi, Contatore Mano, Coppa Obiettivo e Arena -->
      <div id="p1-resource-box" class="relative flex flex-col gap-1.5 items-end w-full">
        <div class="flex items-center gap-2">
          <div class="liquid-pill px-3 py-1.5 rounded-2xl flex items-center gap-1.5 text-rose-300 font-black text-sm">
            <i data-lucide="heart" class="w-4 h-4 fill-current"></i>
            <span id="p1-hp">20</span>
          </div>
          <div class="liquid-pill px-3 py-1.5 rounded-2xl flex items-center gap-1.5 text-cyan-300 font-black text-sm">
            <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
            <span id="p1-pc">5</span>
          </div>
        </div>

        <!-- Badge dei Buff Temporanei Attivi su P1 -->
        <div id="p1-buff-row" class="flex flex-wrap justify-end gap-1 min-h-[18px]"></div>

        <!-- Linea Obiettivo, Arena e Contatore Carte in Mano (con Max raggiungibile) -->
        <div class="flex items-center gap-1.5">
          <div class="liquid-pill px-2.5 py-2 rounded-2xl text-[11px] font-black text-white/90 flex items-center gap-1" title="Carte in mano / Limite Massimo">
            <span>🃏</span>
            <span id="p1-hand-counter">5/7</span>
          </div>
          <button onclick="UI.toggleObjectiveModal()" class="liquid-pill p-2.5 rounded-2xl text-amber-300 active:scale-95 transition">
            <i data-lucide="trophy" class="w-4 h-4"></i>
          </button>
          <button id="arena-badge" onclick="UI.toggleArenaModal()" class="liquid-pill p-2.5 rounded-2xl text-cyan-300 active:scale-95 transition">
            <i data-lucide="map" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

        <!-- In basso a destra: Artwork del mio Leader (Cliccabile per dettagli + Uso abilità) -->
        <div id="my-leader-portrait" onclick="UI.inspectMyLeader()" 
            class="liquid-glass w-28 h-28 rounded-3xl p-1.5 cursor-pointer relative overflow-hidden flex flex-col justify-end items-center group active:scale-95 transition">
            <div id="my-leader-art" class="absolute inset-0 z-0"></div>
            <span id="p1-leader-name" class="relative z-10 text-[10px] font-black bg-black/60 px-2 py-0.5 rounded-full truncate max-w-full">Leader</span>
        </div>

        </div>
    </section>

    <!-- POPUP TOAST AUTOMATICO ("Tocca a..." / "Nuovo Round...") -->
    <div id="turn-popup" class="hidden fixed inset-0 z-40 pointer-events-none flex items-center justify-center">
        <div id="turn-popup-text" class="liquid-glass px-8 py-4 text-xl font-black tracking-wide text-white shadow-2xl animate-pop"></div>
    </div>

    <!-- TAB VISIVO UNIVERSALE (Carta Custom, Scontro Animato, Azione con Conferma, Info Leader) -->
    <!-- ANIMAZIONE CENTRALE ANNUNCIO ATTACCO / AZIONE ("P1 attacca P2") -->
    <div id="center-action-banner" class="hidden fixed inset-0 z-40 pointer-events-none flex items-center justify-center">
        <div id="center-action-content" class="liquid-glass px-7 py-3.5 rounded-3xl border-2 border-rose-400/80 text-base font-black tracking-wide text-white shadow-2xl flex items-center gap-3 animate-pop"></div>
    </div>

    <!-- TAB VISIVO SENZA RIQUADRO GRIGIO DI SFONDO (Supporta Swipe Orizzontale) -->
    <div id="glass-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
        <div id="modal-content-box" class="max-w-2xl w-full flex flex-col items-center gap-3 text-center animate-pop">
        <div id="modal-custom-view" class="w-full flex items-center justify-center"></div>
        <div id="modal-actions" class="flex gap-3 mt-1 w-full justify-center">
            <button id="modal-close-btn" onclick="UI.closeModal()" class="liquid-pill px-8 py-2 rounded-xl text-xs font-bold">Chiudi</button>
        </div>
        </div>
    </div>

    <!-- OVERLAY PULSAZIONE ROSSA TENUE QUANDO SEI ATTACCATO E DEVI DIFENDERTI -->
    <div id="under-attack-overlay" class="hidden fixed inset-0 pointer-events-none z-30 under-attack-vignette"></div>

    </main>

  <!-- Script Modulari (Che genereremo nelle Parti 2 e 3) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="database.js"></script>
  <script src="engine.js"></script>
  <script src="multiplayer.js"></script>
</body>
</html>
